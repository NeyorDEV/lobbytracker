name: Release

# Projet fusionné dans RL Tracker Suite : plus de publication automatique sur un tag `vX.Y.Z`.
# Les tags de redirection (v0.1.4) n'ont pas à déclencher de build ; lancement manuel seulement.
# Un build exige le secret TAURI_SIGNING_PRIVATE_KEY (signature des mises à jour).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install tauri-cli --version "^2" --locked
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signe les mises à jour automatiques (secret à créer dans les réglages du dépôt).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "LobbyTracker ${{ github.ref_name }}"
          releaseBody: "Installeur Windows (NSIS). Windows peut afficher SmartScreen : l'exécutable n'est pas signé."
          releaseDraft: true
